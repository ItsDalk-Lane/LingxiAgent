name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        node-version: ["24.15.0"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci 走网络下载依赖，偶发抖动（连接重置 / registry 5xx）会直接挂掉整个
      # 矩阵。这里用 nick-fields/retry 在步骤层面重试，不改 npm 本身、不改 lockfile。
      # cache: npm 已生效（默认 cache-dependency-path 指向仓库根 package-lock.json，
      # 该文件 git 追踪中、在根目录）；日志里的 "npm cache is not found" 是首次运行
      # 冷缓存或缓存服务抖动的正常现象，不是 lockfile 路径配错——无需改 cache-dependency-path。
      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci

      - name: Build Windows sandbox helper
        if: runner.os == 'Windows'
        run: node scripts/build-windows-sandbox-helper.mjs x64

      - name: Smoke-test Windows restricted-token helper
        if: runner.os == 'Windows'
        run: node scripts/smoke-windows-sandbox-helper.mjs x64

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build packages
        run: npm run build:packages

      - name: Build renderer
        run: npm run build:renderer

      # The tag-only Build workflow verifies the extracted Windows standalone
      # package by launching its real hana-server.cmd and exercising exec_command.
      # Keep that release boundary covered in ordinary CI too, using a throwaway
      # signing key/keyset that exists only under RUNNER_TEMP. Production release
      # jobs still require the repository LINGXI_SIGN_KEY secret and pinned keyset.
      - name: Prepare ephemeral signing key for Windows standalone smoke
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/artifact-keygen.mjs \
            --out "$RUNNER_TEMP/hana-ci-sign-key.pem" \
            --key-id ci-ephemeral \
            > "$RUNNER_TEMP/hana-ci-key.json"
          node -e \
            'const fs = require("fs"); const entry = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); fs.writeFileSync(process.argv[2], JSON.stringify([entry]));' \
            "$RUNNER_TEMP/hana-ci-key.json" \
            "$RUNNER_TEMP/hana-ci-keyset.json"
          echo "LINGXI_SIGN_KEY=$RUNNER_TEMP/hana-ci-sign-key.pem" >> "$GITHUB_ENV"
          echo "LINGXI_SIGN_KEYSET=$RUNNER_TEMP/hana-ci-keyset.json" >> "$GITHUB_ENV"

      - name: Download MinGit for Windows standalone smoke
        if: runner.os == 'Windows'
        run: node scripts/download-mingit.js

      - name: Build Windows server bundle for standalone smoke
        if: runner.os == 'Windows'
        run: node scripts/build-server.mjs win32 x64

      - name: Build Windows standalone server archive in CI
        if: runner.os == 'Windows'
        run: node scripts/build-standalone-server-artifact.mjs x64

      - name: Smoke-test packaged Windows standalone server
        if: runner.os == 'Windows'
        run: node scripts/verify-standalone-server-artifact.mjs x64 --smoke

      - name: Run tests
        run: npm test

  # persistence-schema 防呆：当 diff 触及指纹所钉的受护源文件（持久化存储、
  # site 映射源等共 ~149 个）、而 build/persistence-schema-fingerprint.json
  # 未在同一次提交里更新时，在这里比 test 矩阵更早地 fail 并提示重钉命令。
  # 纯 git diff + JSON 解析，不跑 vitest、不解析 TypeScript、不装 npm 依赖，
  # 因此与 test/lint-open-boundary/open-build-smoke 并行，不阻塞它们的启动。
  # 权威 tripwire 仍是 npm test 里的 tests/persistence-schema-tripwire.test.ts
  # （它跑完整的 assertCommittedPersistenceSchemaFingerprint），这里是它的快前哨。
  persistence-schema-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 base..HEAD 的完整历史来算 diff（push 事件下 GitHub 默认浅克隆拿不到 before SHA 的提交）。
          fetch-depth: 0

      - name: Check persistence schema fingerprint repinned
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-persistence-schema-fingerprint.mjs

  # 独立于上面 test 矩阵：只跑边界 lint 脚本本身，给"开/闭边界回归"一个比
  # 全量矩阵（typecheck/lint/build/test 跑完才轮到 npm test 里的边界用例）
  # 更快的失败信号。npm test 仍会通过 tests/open-boundary-lint.test.ts 的
  # 冒烟用例 spawn 同一个脚本验证退出码/输出，这里不是重复覆盖，是提前示警。
  lint-open-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint open/closed import boundary
        run: node scripts/lint-open-boundary.mjs

  # 证明"开源 composition 构建"这条独立产物链没有烧掉：构建 + spawn 冒烟。
  # 与 build.yml 的安装包矩阵无关——那条链打的是闭集产品安装包，从不触碰
  # server/main-open.ts 这个开源薄入口。npm ci 走网络下载依赖，网络抖动允许
  # 重试一次（不改脚本本身，只在 workflow 步骤层面兜底）。
  open-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies (with one retry on network failure)
        run: npm ci || (echo "npm ci failed, retrying once..." && npm ci)

      - name: Build open composition server
        run: npm run build:server:open

      - name: Smoke-test open composition server
        run: npm run smoke:server:open
