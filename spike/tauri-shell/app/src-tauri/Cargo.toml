[package]
name = "lingxi-tauri-shell-spike"
version = "0.1.0"
description = "R01-T06 isolated Tauri v2 shell capability & security spike (not a production entrypoint)"
edition = "2021"
rust-version = "1.85"

[lib]
name = "spike_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
# 嵌入式 WebDriver 测试入口。只允许进测试构建；release 构建必须证明不含该入口（R01-A12）。
e2e-test = ["dep:tauri-plugin-wdio-webdriver"]

[profile.release]
panic = "unwind"
