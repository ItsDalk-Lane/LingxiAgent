[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# Zero NEW third-party dependencies: serde_json is already in Cargo.lock
# (workspace graph via lingxi-protocol/lingxi-service); xtask adds no new
# package versions, only a member dependency edge. Argument parsing is
# hand-written on purpose (the 05-protocol interface is three fixed
# subcommands — a CLI framework would be a new dependency for nothing).
serde_json = "1"
