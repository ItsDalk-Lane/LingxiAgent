[package]
name = "lingxi-protocol"
description = "Wire types, errors, IDs and schema anchors for the Lingxi agent protocol. Must never depend on tauri/electron or any desktop/webview stack."
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# R01-T02: serde data types are the single protocol authority; schemars
# derives the generated JSON Schema; sha1/sha2/base64 serve the handshake
# prototype (WS accept key) and content digests. Exact versions are pinned
# by rust/Cargo.lock; the toolchain/version locking policy itself is
# R01-T03 scope.
base64 = "0.23.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
