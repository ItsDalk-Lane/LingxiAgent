[package]
name = "lingxi-kernel"
description = "Domain rules, run state machine, context assembly and ports. Depends only on lingxi-protocol; never on tauri/electron and never on lingxi-adapters (implementations are injected by lingxi-service)."
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lingxi-protocol = { path = "../lingxi-protocol" }
# R04-T01: the tool catalog's schema subset validation, effective-argument
# canonicalization and digest derivation work on JSON values directly.
# Same locked version as lingxi-protocol/lingxi-service (no new package
# version enters the lock).
serde_json = "1.0.151"
# R06-T03: file-version conflict detection hashes (sha256 over file bytes).
# Same locked version as lingxi-protocol/lingxi-adapters (no new package
# version enters the lock).
sha2 = "0.11.0"
# R06-T06: test-only guard edge (pre-main RSS/time monitor for every test
# binary). `optional = true` + the `test-guard` feature below — enabled
# ONLY through dev-dependencies, so no build/release graph links it.
lingxi-test-guard = { path = "../lingxi-test-guard", optional = true }

[features]
# R06-T06: force-links the guard into every test binary that links kernel
# (see src/lib.rs). Enabled exclusively by dev-dependency edges; never by
# a normal dependency or a default feature.
test-guard = ["dep:lingxi-test-guard"]

[dev-dependencies]
# R06-T06: enables `test-guard` for kernel's OWN test builds (unit tests +
# tests/*.rs) via feature unification of the self dev-dependency — the
# guard then arms before the libtest harness of every kernel test binary.
lingxi-kernel = { path = ".", features = ["test-guard"] }
