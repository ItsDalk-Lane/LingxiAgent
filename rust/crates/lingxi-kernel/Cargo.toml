[package]
name = "lingxi-kernel"
description = "Domain rules, run state machine, context assembly and ports. Depends only on lingxi-protocol; never on tauri/electron and never on lingxi-adapters (implementations are injected by lingxi-service)."
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lingxi-protocol = { path = "../lingxi-protocol" }
# R04-T01: the tool catalog's schema subset validation, effective-argument
# canonicalization and digest derivation work on JSON values directly.
# Same locked version as lingxi-protocol/lingxi-service (no new package
# version enters the lock).
serde_json = "1.0.151"
# R06-T03: file-version conflict detection hashes (sha256 over file bytes).
# Same locked version as lingxi-protocol/lingxi-adapters (no new package
# version enters the lock).
sha2 = "0.11.0"
